<!DOCTYPE html>
<html>
<head>
    <title>Gerenciamento de Usuários</title>
</head>
<body>
    <h1>Lista de Usuários</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.quantidade }}</td>
                <td>
                    <a href="{{ url_for('edit_user_page', user_id=user.id) }}">Modificar</a> | 
                    <form method="POST" action="{{ url_for('delete_user_page', user_id=user.id) }}" style="display:inline;">
                        <input type="submit" value="Deletar" onclick="return confirm('Tem certeza que deseja deletar?');">
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <hr>

    <h2>Adicionar Novo Usuário</h2>
    <form method="POST" action="{{ url_for('create_user_page') }}">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="quantidade">Quantidade:</label>
        <input type="text" id="quantidade" name="quantidade" required><br><br>
        
        <input type="submit" value="Adicionar Usuário">
    </form>
</body>
</html>
