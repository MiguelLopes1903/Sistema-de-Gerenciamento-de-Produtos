<!DOCTYPE html>
<html>
<head>
    <title>Modificar Usuário</title>
</head>
<body>
    <h1>Modificar Usuário ID:</h1>
    
    
    <form method="POST" action="{{ url_for('update_user_page', user_id=user.id) }}">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" value="{{ user.name }}" required><br><br>
        
        <label for="quantidade">Quantidade:</label>
        <input type="text" id="quantidade" name="quantidade" value="{{ user.quantidade }}" required><br><br>
        
        <input type="submit" value="Salvar Alterações">
    </form>
    
    <hr>
    <a href="{{ url_for('index') }}">Voltar para a Lista</a>
</body>
</html>
